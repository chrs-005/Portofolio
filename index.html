<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christophe El Chabab</title>
  <meta name="description" content="Christophe El Chabab. Machine learning, research and software at the American University of Beirut." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2307080a'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='bold' fill='%23ecebe6' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Archivo + Newsreader (the breedlove.xyz pairing) + JetBrains Mono for labels -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

  <!-- always-moving smoke field (js/bg.js); the Higgsfield texture is the no-WebGL fallback -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="nav-name" href="#top">Christophe El Chabab</a>
    <nav class="nav-links" id="navLinks" aria-label="Sections"></nav>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">Sound <span id="soundState">off</span></button>
  </header>

  <main id="top">
    <!-- tall wrapper: the hero stays sticky while the exit plays -->
    <div class="hero-wrap" id="heroWrap">
      <section class="hero" id="hero">
        <div class="layer layer-ghost" id="layerGhost" aria-hidden="true">
          <span class="ghost-word" id="ghostWord"></span>
        </div>

        <div class="layer layer-fg">
          <div class="hero-stage" id="heroStage">
            <h1 class="name" id="name"></h1>
            <p class="intro" id="intro"></p>
            <p class="hero-links" id="heroLinks"></p>
          </div>
        </div>

        <div class="hero-corner hero-corner-l mono" id="cornerL"></div>
        <div class="hero-corner hero-corner-r mono" id="cornerR"></div>
      </section>
    </div>

    <section class="section" id="research"></section>
    <section class="section" id="projects"></section>
    <section class="section" id="experience"></section>
    <section class="section" id="about"></section>

    <section class="section contact" id="contact">
      <p class="mono contact-label" id="contactLabel"></p>
      <a class="contact-email" id="contactEmail" href="#"></a>
      <p class="contact-note" id="contactNote"></p>
      <p class="contact-links" id="contactLinks"></p>
      <footer class="footer mono">
        <span id="footerLeft"></span>
        <span id="footerRight"></span>
      </footer>
    </section>
  </main>

  <!-- image lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <figure>
      <img id="lightboxImg" alt="" />
      <figcaption id="lightboxCap"></figcaption>
    </figure>
    <button class="lightbox-close mono" id="lightboxClose" type="button">Close</button>
  </div>

  <script src="js/content.js?v=4"></script>
  <script src="js/sound.js?v=3"></script>
  <script src="js/bg.js?v=3"></script>
  <script src="js/visuals.js?v=9"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
